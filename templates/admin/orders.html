{% extends "admin_base.html" %}

{% block title %}Manage Orders - AcademicWrite{% endblock %}

{% block extra_css %}
<style>
    .order-card {
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
    }
    
    .order-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }
    
    .order-card.overdue {
        border-left: 4px solid #ef4444;
        background: #fef2f2;
    }
    
    .order-card.approaching {
        border-left: 4px solid #eab308;
        background: #fffbeb;
    }
    
    .order-card.completed {
        border-left: 4px solid #22c55e;
        background: #f0fdf4;
    }
    
    .order-card.cancelled {
        border-left: 4px solid #ef4444;
        background: #fef2f2;
    }
    
    .order-card.declined {
        border-left: 4px solid #ef4444;
        background: #fef2f2;
    }
    
    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 6px;
    }
    
    .status-dot.request { background: #f59e0b; }
    .status-dot.in_progress { background: #3b82f6; }
    .status-dot.awaiting_approval { background: #8b5cf6; }
    .status-dot.completed { background: #22c55e; }
    .status-dot.cancelled { background: #ef4444; }
    .status-dot.declined { background: #ef4444; }
    .status-dot.refund_pending { background: #f59e0b; }
    
    .filter-btn {
        transition: all 0.2s ease;
        cursor: pointer;
    }
    
    .filter-btn.active {
        background: #059669;
        color: white;
        border-color: #059669;
    }
    
    .filter-btn.active:hover {
        background: #047857;
        border-color: #047857;
    }
    
    .request-badge {
        background: #fef3c7;
        color: #d97706;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
    
    .page-size-select {
        padding: 4px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 0.875rem;
        background: white;
    }
    
    .time-badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 500;
    }
    
    .time-badge.overdue {
        background: #fef2f2;
        color: #dc2626;
    }
    
    .time-badge.approaching {
        background: #fffbeb;
        color: #d97706;
    }
    
    .time-badge.safe {
        background: #f0fdf4;
        color: #059669;
    }
    
    .time-badge.completed {
        background: #dcfce7;
        color: #166534;
    }
    
    .action-btn {
        transition: all 0.2s ease;
    }
    
    .action-btn:active {
        transform: scale(0.95);
    }
    
    .modal-content {
        animation: modalIn 0.25s ease;
    }
    
    @keyframes modalIn {
        from {
            opacity: 0;
            transform: scale(0.95) translateY(10px);
        }
        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }
    
    .search-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 1px solid #e5e7eb;
        border-top: none;
        border-radius: 0 0 8px 8px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 20;
        display: none;
        box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }
    
    .suggestion-item {
        padding: 8px 16px;
        cursor: pointer;
        transition: background 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
    }
    
    .suggestion-item:hover {
        background: #f3f4f6;
    }
    
    .suggestion-item .highlight {
        background: #fbbf24;
        padding: 0 2px;
        border-radius: 2px;
    }
    
    .search-wrapper {
        position: relative;
    }
    
    .search-wrapper input {
        padding-left: 36px;
        transition: all 0.2s ease;
        width: 100%;
    }
    
    .search-wrapper input:focus {
        border-color: #059669;
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }
    
    .search-wrapper .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
    }
    
    .clear-search {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        cursor: pointer;
        padding: 4px;
        display: none;
        transition: color 0.2s ease;
    }
    
    .clear-search:hover {
        color: #374151;
    }
    
    .clear-search.visible {
        display: block;
    }
    
    .toast-notification {
        animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    
    .rating-stars {
        display: inline-flex;
        gap: 0.05rem;
        font-size: 0.75rem;
    }
    .rating-stars .filled {
        color: #fbbf24;
    }
    .rating-stars .empty {
        color: #d1d5db;
    }
    
    @media (max-width: 640px) {
        .order-card {
            padding: 12px;
        }
        
        .action-btn {
            padding: 4px 10px;
            font-size: 0.7rem;
        }
        
        .filter-btn {
            padding: 4px 12px;
            font-size: 0.7rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Orders</h1>
            <p class="text-sm text-gray-500 mt-0.5">Manage order requests and active orders</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <div class="search-wrapper w-48 sm:w-64">
                <input type="text" id="searchOrders" class="w-full px-4 py-2 pr-10 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition text-sm" placeholder="Search orders..." value="{{ search }}" autocomplete="off">
                <span class="search-icon">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </span>
                <button id="clearSearch" class="clear-search">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
                <div id="searchSuggestions" class="search-suggestions"></div>
            </div>
            <button id="refreshBtn" class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors text-gray-600">
                Refresh
            </button>
        </div>
    </div>

    <div class="flex flex-wrap items-center gap-2 mb-6">
        <button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-gray-300 hover:border-green-500 hover:text-green-600 transition-all active" data-status="all">All</button>
        <button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-gray-300 hover:border-green-500 hover:text-green-600 transition-all" data-status="request">Requests</button>
        <button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-gray-300 hover:border-green-500 hover:text-green-600 transition-all" data-status="in_progress">In Progress</button>
        <button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-gray-300 hover:border-green-500 hover:text-green-600 transition-all" data-status="awaiting_approval">Awaiting Approval</button>
        <button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-gray-300 hover:border-green-500 hover:text-green-600 transition-all" data-status="completed">Completed</button>
        <button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-gray-300 hover:border-green-500 hover:text-green-600 transition-all" data-status="cancelled">Cancelled</button>
        <button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-gray-300 hover:border-green-500 hover:text-green-600 transition-all" data-status="declined">Declined</button>
        <button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-gray-300 hover:border-green-500 hover:text-green-600 transition-all" data-status="refund_pending">Refund</button>
    </div>

    <div id="ordersContainer" class="space-y-3">
        <div class="text-center text-gray-400 py-12">Loading orders...</div>
    </div>

    <div id="pagination" class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-6 pt-4 border-t border-gray-200">
        <div class="flex items-center gap-3 text-sm text-gray-500">
            <span id="paginationInfo">Showing 0-0 of 0 orders</span>
            <select id="pageSizeSelect" class="page-size-select">
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200" selected>200</option>
            </select>
        </div>
        <div class="flex items-center gap-2">
            <button class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed text-sm" id="prevPage" disabled>Previous</button>
            <span class="text-sm text-gray-600" id="pageInfo">Page 1 of 1</span>
            <button class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed text-sm" id="nextPage" disabled>Next</button>
        </div>
    </div>
</div>

<div id="actionDialog" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 modal-content">
        <div id="dialogContent"></div>
    </div>
</div>

<script>
let currentPage = 1;
let currentStatus = 'all';
let currentSearch = '';
let pageSize = 200;
let totalPages = 1;
let selectedOrderId = null;
let autoRefreshInterval = null;
let isLoading = false;
let searchTimeout = null;
let allOrders = [];

const API_BASE = '/api/v1/admin';

document.addEventListener('DOMContentLoaded', function() {
    loadOrders();
    startAutoRefresh();
    setupEventListeners();
});

function setupEventListeners() {
    const searchInput = document.getElementById('searchOrders');
    const clearSearch = document.getElementById('clearSearch');
    const searchSuggestions = document.getElementById('searchSuggestions');

    searchInput.addEventListener('input', function() {
        const value = this.value.trim();
        if (value.length > 0) {
            clearSearch.classList.add('visible');
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                showSuggestions(value);
            }, 300);
        } else {
            clearSearch.classList.remove('visible');
            searchSuggestions.classList.remove('active');
            if (currentSearch) {
                currentSearch = '';
                currentPage = 1;
                loadOrders();
            }
        }
    });

    clearSearch.addEventListener('click', function() {
        searchInput.value = '';
        this.classList.remove('visible');
        searchSuggestions.classList.remove('active');
        currentSearch = '';
        currentPage = 1;
        loadOrders();
        searchInput.focus();
    });

    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchSuggestions.classList.remove('active');
            currentSearch = this.value.trim();
            currentPage = 1;
            loadOrders();
        }
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-wrapper')) {
            searchSuggestions.classList.remove('active');
        }
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentStatus = this.dataset.status;
            currentPage = 1;
            loadOrders();
        });
    });

    document.getElementById('refreshBtn').addEventListener('click', function() {
        loadOrders();
    });

    document.getElementById('pageSizeSelect').addEventListener('change', function() {
        pageSize = parseInt(this.value);
        currentPage = 1;
        loadOrders();
    });

    document.getElementById('prevPage').addEventListener('click', function() {
        if (currentPage > 1) {
            currentPage--;
            loadOrders();
        }
    });

    document.getElementById('nextPage').addEventListener('click', function() {
        if (currentPage < totalPages) {
            currentPage++;
            loadOrders();
        }
    });
}

function showSuggestions(query) {
    const container = document.getElementById('searchSuggestions');
    const searchInput = document.getElementById('searchOrders');
    
    if (!allOrders || allOrders.length === 0) {
        container.classList.remove('active');
        return;
    }

    const results = allOrders.filter(order => {
        const searchStr = `${order.order_number} ${order.topic} ${order.client_name || ''} ${order.client?.full_name || ''}`.toLowerCase();
        return searchStr.includes(query.toLowerCase());
    }).slice(0, 8);

    if (results.length === 0) {
        container.innerHTML = `
            <div class="p-3 text-sm text-gray-500 text-center">No results found</div>
        `;
        container.classList.add('active');
        return;
    }

    container.innerHTML = results.map(order => `
        <div class="suggestion-item" data-order-id="${order.id}">
            <span>#${order.order_number}</span>
            <span class="text-gray-400">-</span>
            <span>${highlightText(order.topic || 'Untitled', query)}</span>
            <span class="text-xs text-gray-400 ml-auto">${formatStatus(order.status)}</span>
        </div>
    `).join('');

    container.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', function() {
            const orderId = this.dataset.orderId;
            const order = allOrders.find(o => o.id === orderId);
            if (order) {
                searchInput.value = `#${order.order_number} - ${order.topic}`;
                currentSearch = order.order_number;
                container.classList.remove('active');
                currentPage = 1;
                loadOrders();
            }
        });
    });

    container.classList.add('active');
}

function highlightText(text, query) {
    if (!text || !query) return text;
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<span class="highlight">$1</span>');
}

function startAutoRefresh() {
    if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    autoRefreshInterval = setInterval(function() {
        if (!document.hidden && !isLoading) {
            loadOrders(true);
        }
    }, 30000);
}

function formatCurrency(amount) {
    if (amount === undefined || amount === null || amount === '') return '$0.00';
    const num = parseFloat(amount);
    if (isNaN(num)) return '$0.00';
    return '$' + num.toFixed(2);
}

function formatDate(dateString) {
    if (!dateString) return 'N/A';
    try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return 'N/A';
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    } catch (e) {
        return 'N/A';
    }
}

function getUrgencyLevel(deadline) {
    if (!deadline) return 'safe';
    const now = new Date();
    const due = new Date(deadline);
    const diff = due - now;
    const hours = diff / (60 * 60 * 1000);
    
    if (diff < 0) return 'overdue';
    if (hours < 24) return 'approaching';
    if (hours < 72) return 'approaching';
    return 'safe';
}

function getTimeRemaining(deadline) {
    if (!deadline) return '';
    const now = new Date();
    const due = new Date(deadline);
    const diff = due - now;
    
    if (diff < 0) {
        const hours = Math.floor(Math.abs(diff) / (60 * 60 * 1000));
        if (hours < 24) {
            return hours + 'h overdue';
        }
        return Math.floor(hours / 24) + 'd ' + (hours % 24) + 'h overdue';
    }
    
    const hours = Math.floor(diff / (60 * 60 * 1000));
    const minutes = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
    
    if (hours > 24) {
        const days = Math.floor(hours / 24);
        return days + 'd ' + (hours % 24) + 'h remaining';
    }
    if (hours > 0) {
        return hours + 'h ' + minutes + 'm remaining';
    }
    return minutes + 'm remaining';
}

function renderRatingStars(rating) {
    if (!rating) return '';
    let stars = '';
    for (let i = 1; i <= 5; i++) {
        stars += `<span class="${i <= rating ? 'filled' : 'empty'}">★</span>`;
    }
    return `<span class="rating-stars">${stars}</span>`;
}

async function loadOrders(silent = false) {
    if (isLoading) return;
    isLoading = true;

    const container = document.getElementById('ordersContainer');

    try {
        const params = new URLSearchParams();
        params.append('page', currentPage);
        params.append('page_size', pageSize);
        if (currentStatus !== 'all') params.append('status', currentStatus);
        if (currentSearch) params.append('search', currentSearch);

        const response = await fetch(API_BASE + '/orders/?' + params.toString(), {
            headers: {
                'X-CSRFToken': getCsrfToken(),
                'Accept': 'application/json'
            },
            credentials: 'include'
        });

        if (!response.ok) {
            throw new Error('Failed to load orders');
        }

        const data = await response.json();
        const orders = data.results || data || [];
        allOrders = orders;
        totalPages = Math.ceil((data.total || orders.length) / (data.page_size || pageSize)) || 1;
        displayOrders(orders, data);
        updatePagination(data);

    } catch (error) {
        console.error('Orders load error:', error);
        container.innerHTML = `
            <div class="bg-white border border-gray-200 rounded-lg p-8 text-center">
                <p class="text-gray-600 text-sm mb-2">Unable to load orders</p>
                <button onclick="loadOrders()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm">
                    Try Again
                </button>
            </div>
        `;
    } finally {
        isLoading = false;
    }
}

function displayOrders(orders, data) {
    const container = document.getElementById('ordersContainer');

    if (!orders || orders.length === 0) {
        const emptyMessage = currentStatus === 'request'
            ? 'No pending order requests'
            : 'No orders found';
        container.innerHTML = `
            <div class="bg-white border border-gray-200 rounded-lg p-12 text-center">
                <p class="text-gray-600 font-medium">${emptyMessage}</p>
                <p class="text-sm text-gray-400 mt-1">Try adjusting your filters or search terms</p>
            </div>
        `;
        return;
    }

    container.innerHTML = orders.map((order) => {
        const clientName = order.client_name || order.client?.full_name || order.client?.email || 'N/A';
        const orderNumber = order.order_number || 'N/A';
        const topic = order.topic || order.title || 'Untitled';
        const totalPrice = order.total_price || order.total || 0;
        const statusColor = getStatusColor(order.status);
        const statusLabel = formatStatus(order.status);
        const urgency = getUrgencyLevel(order.deadline);
        const isOverdue = urgency === 'overdue';
        const isApproaching = urgency === 'approaching';
        const isRequest = order.status === 'request';
        const timeRemaining = getTimeRemaining(order.deadline);
        const isCompleted = order.status === 'completed';
        const isCancelled = order.status === 'cancelled';
        const isDeclined = order.status === 'declined';
        const isFinalStatus = isCompleted || isCancelled || isDeclined;

        let cardClass = '';
        let timeBadgeClass = 'safe';
        let timeLabel = '';
        let completionDate = '';
        
        if (isCompleted) {
            cardClass = 'completed';
            timeBadgeClass = 'completed';
            timeLabel = 'Completed';
            completionDate = order.completed_at ? formatDate(order.completed_at) : '';
        } else if (isCancelled) {
            cardClass = 'cancelled';
            timeBadgeClass = 'overdue';
            timeLabel = 'Cancelled';
            completionDate = order.cancelled_at ? formatDate(order.cancelled_at) : '';
        } else if (isDeclined) {
            cardClass = 'declined';
            timeBadgeClass = 'overdue';
            timeLabel = 'Declined';
            completionDate = order.declined_at ? formatDate(order.declined_at) : '';
        } else if (isOverdue && !isFinalStatus) {
            cardClass = 'overdue';
            timeBadgeClass = 'overdue';
            timeLabel = 'Overdue';
        } else if (isApproaching && !isFinalStatus) {
            cardClass = 'approaching';
            timeBadgeClass = 'approaching';
            timeLabel = 'Approaching';
        }

        const ratingStars = order.rating ? renderRatingStars(order.rating) : '';

        return `
            <div class="order-card bg-white border border-gray-200 rounded-lg p-4 ${cardClass}">
                <div class="flex flex-wrap items-start justify-between gap-3">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-3 flex-wrap">
                            <a href="/admin/orders/${order.id}/" class="text-sm font-medium text-green-600 hover:text-green-700">
                                #${orderNumber}
                            </a>
                            ${isRequest ? '<span class="request-badge">Request</span>' : ''}
                            <span class="text-xs px-2 py-0.5 rounded-full ${statusColor}">
                                <span class="status-dot ${order.status}"></span>${statusLabel}
                            </span>
                            ${timeLabel ? `<span class="time-badge ${timeBadgeClass}">${timeLabel}</span>` : ''}
                            ${ratingStars ? `<span class="text-xs text-gray-500 ml-1">${ratingStars}</span>` : ''}
                        </div>
                        <h4 class="text-sm font-medium text-gray-800 mt-1 truncate">${topic}</h4>
                        <div class="flex flex-wrap items-center gap-3 mt-1 text-xs text-gray-500">
                            <span>${clientName}</span>
                            <span>•</span>
                            <span>${order.words || order.word_count || 0} words</span>
                            <span>•</span>
                            <span>${order.academic_level || 'Standard'}</span>
                            ${!isFinalStatus && order.deadline ? `
                                <span>•</span>
                                <span>Due ${formatDate(order.deadline)}</span>
                                <span class="time-badge ${timeBadgeClass}">${timeRemaining}</span>
                            ` : ''}
                            ${completionDate ? `
                                <span>•</span>
                                <span class="text-green-600">${timeLabel} ${completionDate}</span>
                            ` : ''}
                            ${order.rating && order.feedback ? `
                                <span>•</span>
                                <span class="text-gray-400 text-xs" title="${order.feedback}">"${order.feedback.length > 30 ? order.feedback.substring(0, 30) + '...' : order.feedback}"</span>
                            ` : ''}
                        </div>
                        ${isRequest ? `
                            <div class="mt-2 text-xs text-amber-600 bg-amber-50 px-3 py-1 rounded border border-amber-200 inline-block">
                                Awaiting your decision
                            </div>
                        ` : ''}
                        ${isCancelled && order.cancellation_feedback ? `
                            <div class="mt-2 text-xs text-red-600 bg-red-50 px-3 py-1 rounded border border-red-200 inline-block">
                                Cancelled: ${order.cancellation_feedback}
                            </div>
                        ` : ''}
                        ${isDeclined && order.declined_reason ? `
                            <div class="mt-2 text-xs text-red-600 bg-red-50 px-3 py-1 rounded border border-red-200 inline-block">
                                Declined: ${order.declined_reason}
                            </div>
                        ` : ''}
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <span class="text-sm font-medium text-gray-900">${formatCurrency(totalPrice)}</span>
                        <div class="flex items-center gap-2 flex-wrap justify-end">
                            ${getActionButtons(order)}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function getActionButtons(order) {
    const actions = [];

    if (order.status === 'request') {
        actions.push(`
            <button onclick="openActionDialog('accept', '${order.id}')" class="action-btn px-3 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700 transition-colors">
                Accept
            </button>
            <button onclick="openActionDialog('reject', '${order.id}')" class="action-btn px-3 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700 transition-colors">
                Reject
            </button>
        `);
    }

    if (order.status === 'in_progress') {
        actions.push(`
            <a href="/admin/orders/${order.id}/" class="action-btn px-3 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
                Workspace
            </a>
            <button onclick="openActionDialog('deliver', '${order.id}')" class="action-btn px-3 py-1 text-xs bg-purple-600 text-white rounded hover:bg-purple-700 transition-colors">
                Deliver
            </button>
        `);
    }

    if (order.status === 'awaiting_approval') {
        actions.push(`
            <span class="text-xs text-gray-500">Waiting for client</span>
        `);
    }

    if (order.status === 'refund_pending') {
        actions.push(`
            <a href="/admin/refunds/${order.id}/" class="action-btn px-3 py-1 text-xs bg-yellow-600 text-white rounded hover:bg-yellow-700 transition-colors">
                Review Refund
            </a>
        `);
    }

    if (order.status === 'completed') {
        actions.push(`
            <span class="text-xs text-green-600 font-medium">${order.rating ? 'Rated ' + order.rating + '/5' : 'Completed'}</span>
        `);
    }

    if (order.status === 'cancelled') {
        actions.push(`
            <span class="text-xs text-red-600 font-medium">Cancelled</span>
        `);
    }

    if (order.status === 'declined') {
        actions.push(`
            <span class="text-xs text-red-600 font-medium">Declined</span>
        `);
    }

    return actions.length ? actions.join(' ') : `<span class="text-xs text-gray-400">No actions</span>`;
}

function getStatusColor(status) {
    const classes = {
        'request': 'bg-amber-100 text-amber-700',
        'in_progress': 'bg-blue-100 text-blue-700',
        'awaiting_approval': 'bg-purple-100 text-purple-700',
        'completed': 'bg-green-100 text-green-700',
        'cancelled': 'bg-red-100 text-red-700',
        'declined': 'bg-red-100 text-red-700',
        'refund_pending': 'bg-yellow-100 text-yellow-700'
    };
    return classes[status] || 'bg-gray-100 text-gray-600';
}

function formatStatus(status) {
    const labels = {
        'request': 'Request',
        'in_progress': 'In Progress',
        'awaiting_approval': 'Awaiting Approval',
        'completed': 'Completed',
        'cancelled': 'Cancelled',
        'declined': 'Declined',
        'refund_pending': 'Refund Pending'
    };
    return labels[status] || status.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}

function updatePagination(data) {
    const total = data.total || 0;
    const page = data.page || 1;
    const pageSizeVal = data.page_size || pageSize;
    const start = (page - 1) * pageSizeVal + 1;
    const end = Math.min(page * pageSizeVal, total);

    document.getElementById('paginationInfo').textContent = 'Showing ' + (total > 0 ? start : 0) + '-' + end + ' of ' + total + ' orders';
    document.getElementById('pageInfo').textContent = 'Page ' + page + ' of ' + totalPages;
    document.getElementById('prevPage').disabled = page <= 1;
    document.getElementById('nextPage').disabled = page >= totalPages;
}

function openActionDialog(action, orderId) {
    selectedOrderId = orderId;
    const dialog = document.getElementById('actionDialog');
    const content = document.getElementById('dialogContent');

    const dialogs = {
        accept: {
            title: 'Accept Order Request',
            message: 'Are you sure you want to accept this order request? This will start the work process.',
            buttons: `
                <button onclick="closeActionDialog()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors text-sm">Cancel</button>
                <button onclick="acceptOrder()" class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm">Accept Request</button>
            `
        },
        reject: {
            title: 'Reject Order Request',
            message: 'Please provide a reason for rejecting this order request.',
            fields: `
                <textarea id="rejectReason" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition text-sm mt-3" rows="4" placeholder="Reason for rejection..."></textarea>
            `,
            buttons: `
                <button onclick="closeActionDialog()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors text-sm">Cancel</button>
                <button onclick="rejectOrder()" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors text-sm">Reject Request</button>
            `
        },
        deliver: {
            title: 'Deliver Order',
            message: 'Select the completed file to deliver to the client.',
            fields: `
                <div class="mt-3">
                    <input type="file" id="deliverFile" accept=".pdf,.doc,.docx,.zip" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition text-sm">
                    <p class="text-xs text-gray-400 mt-1">Accepted formats: PDF, DOC, DOCX, ZIP</p>
                </div>
            `,
            buttons: `
                <button onclick="closeActionDialog()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors text-sm">Cancel</button>
                <button onclick="deliverOrder()" class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors text-sm">Deliver</button>
            `
        }
    };

    const dialogData = dialogs[action];
    if (!dialogData) return;

    content.innerHTML = `
        <h3 class="text-lg font-bold text-gray-900 mb-2">${dialogData.title}</h3>
        <p class="text-sm text-gray-600">${dialogData.message}</p>
        ${dialogData.fields || ''}
        <div class="flex gap-3 mt-4">
            ${dialogData.buttons}
        </div>
    `;

    dialog.classList.remove('hidden');
    dialog.classList.add('flex');
    document.body.style.overflow = 'hidden';
}

function closeActionDialog() {
    const dialog = document.getElementById('actionDialog');
    dialog.classList.add('hidden');
    dialog.classList.remove('flex');
    document.body.style.overflow = '';
    document.getElementById('rejectReason').value = '';
}

async function acceptOrder() {
    try {
        const response = await fetch('/api/v1/admin/orders/' + selectedOrderId + '/accept/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCsrfToken(),
                'Content-Type': 'application/json'
            },
            credentials: 'include'
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.error || 'Failed to accept');
        }
        
        closeActionDialog();
        loadOrders();
        showToast('Order request accepted');
    } catch (error) {
        showToast(error.message || 'Failed to accept order', 'error');
    }
}

async function rejectOrder() {
    const reason = document.getElementById('rejectReason').value.trim();
    if (!reason) {
        showToast('Please provide a reason for rejection', 'error');
        return;
    }
    try {
        const response = await fetch('/api/v1/admin/orders/' + selectedOrderId + '/reject/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            credentials: 'include',
            body: JSON.stringify({ reason: reason })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.error || 'Failed to reject');
        }
        
        closeActionDialog();
        loadOrders();
        showToast('Order rejected');
    } catch (error) {
        showToast(error.message || 'Failed to reject order', 'error');
    }
}

async function deliverOrder() {
    const fileInput = document.getElementById('deliverFile');
    if (!fileInput || !fileInput.files || !fileInput.files[0]) {
        showToast('Please select a file to deliver', 'error');
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {
        const response = await fetch('/api/v1/admin/orders/' + selectedOrderId + '/deliver/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCsrfToken()
            },
            credentials: 'include',
            body: formData
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.error || 'Failed to deliver');
        }
        
        closeActionDialog();
        loadOrders();
        showToast('Order delivered successfully');
    } catch (error) {
        showToast(error.message || 'Failed to deliver order', 'error');
    }
}

function showToast(message, type) {
    type = type || 'success';
    const existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast-notification fixed top-4 right-4 z-50 bg-white border border-gray-200 rounded-lg shadow-lg p-4 max-w-sm';
    const color = type === 'success' ? 'text-green-600' : 'text-red-600';
    toast.innerHTML = `
        <div class="flex items-center gap-3">
            <span class="${color}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${type === 'success' ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'}"/>
                </svg>
            </span>
            <span class="text-sm text-gray-700">${message}</span>
            <button onclick="this.parentElement.parentElement.remove()" class="text-gray-400 hover:text-gray-600 ml-auto">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    `;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 3000);
}

function getCsrfToken() {
    const token = document.querySelector('[name=csrf-token]')?.content;
    if (token) return token;
    const cookie = document.cookie.split('; ').find(function(row) { return row.startsWith('csrftoken='); });
    return cookie ? cookie.split('=')[1] : '';
}
</script>
