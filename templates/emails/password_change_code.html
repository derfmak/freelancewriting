<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <p>Hello {{ full_name }},</p>
    <p>You requested to change your password. Your verification code is:</p>
    <h2 style="background:#f4f4f4; padding:15px; display:inline-block; letter-spacing:2px;">{{ code }}</h2>
    <p>This code expires in <strong>{{ expiry_minutes }}</strong> minutes.</p>
    <p>If you did not request this, please ignore this email.</p>
    <p>Regards,<br>AcademicWrite Team</p>
</body>
</html>
