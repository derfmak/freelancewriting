{% extends "client_base.html" %}
{% load static %}

{% block title %}Order Details — AcademicWrite{% endblock %}

{% block extra_css %}
<style>
    .page-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
    }

    .page-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: -0.02em;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.15s ease;
    }

    .back-link:hover { color: var(--ink); }

    .badge {
        display: inline-flex;
        align-items: center;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 99px;
        white-space: nowrap;
    }

    .badge.request { background: #fef3c7; color: #d97706; }
    .badge.in_progress { background: #dbeafe; color: #2563eb; }
    .badge.awaiting_approval { background: #ede9fe; color: #7c3aed; }
    .badge.completed { background: #d1fae5; color: #059669; }
    .badge.cancelled { background: #fee2e2; color: #dc2626; }
    .badge.declined { background: #fee2e2; color: #dc2626; }
    .badge.refund_pending { background: #fef3c7; color: #d97706; }

    .detail-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
    }

    @media (min-width: 768px) {
        .detail-grid {
            grid-template-columns: 1fr 320px;
        }
    }

    .main-col {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .side-col {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
    }

    .card-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line-light);
    }

    .card-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
    }

    .card-body {
        padding: 20px;
    }

    .detail-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }

    @media (max-width: 480px) {
        .detail-row { grid-template-columns: 1fr; }
    }

    .detail-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .detail-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .detail-value {
        font-size: 14px;
        color: var(--ink-soft);
        font-weight: 500;
    }

    .divider {
        height: 1px;
        background: var(--line-light);
        margin: 16px 0;
    }

    .topic-block {
        font-size: 14px;
        color: var(--ink);
        font-weight: 600;
        line-height: 1.5;
    }

    .instructions-block {
        font-size: 13px;
        color: var(--ink-soft);
        line-height: 1.7;
        white-space: pre-wrap;
    }

    .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: var(--surface);
        border-radius: var(--radius-sm);
        flex-wrap: wrap;
        gap: 8px;
    }

    .file-item + .file-item { margin-top: 8px; }

    .file-info {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 120px;
    }

    .file-icon {
        color: var(--muted);
        font-size: 16px;
    }

    .file-name {
        font-size: 13px;
        font-weight: 500;
        word-break: break-word;
    }

    .file-size {
        font-size: 11px;
        color: var(--muted);
    }

    .file-download {
        font-size: 12px;
        font-weight: 600;
        color: var(--green);
        text-decoration: none;
        white-space: nowrap;
    }

    .file-download:hover { color: var(--green-dark); }

    .file-item.delivered {
        background: var(--green-pale);
        border: 1px solid var(--green-border);
    }

    .file-item.delivered .file-icon { color: var(--green); }

    .progress-section {
        padding: 16px 0;
    }

    .progress-bar {
        height: 6px;
        background: var(--line);
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    .progress-fill {
        height: 100%;
        background: var(--green);
        border-radius: 99px;
        transition: width 0.6s ease;
    }

    .progress-steps {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        font-weight: 500;
        flex-wrap: wrap;
        gap: 4px;
    }

    .price-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 4px 0;
        color: var(--muted);
        flex-wrap: wrap;
        gap: 8px;
    }

    .price-row.total {
        font-weight: 700;
        font-size: 15px;
        color: var(--ink);
        padding-top: 12px;
        border-top: 1px solid var(--line-light);
        margin-top: 8px;
    }

    .price-row.total .price-amount { color: var(--green); }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 11px 16px;
        font-size: 13px;
        font-weight: 600;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: var(--transition);
        border: none;
        text-decoration: none;
    }

    .btn + .btn { margin-top: 8px; }

    .btn-primary {
        background: var(--green);
        color: white;
    }

    .btn-primary:hover {
        background: var(--green-dark);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(5,150,105,0.25);
    }

    .btn-outline {
        background: transparent;
        color: var(--ink-soft);
        border: 1.5px solid var(--line);
    }

    .btn-outline:hover {
        background: var(--surface);
        border-color: var(--muted);
    }

    .btn-danger {
        background: transparent;
        color: var(--red);
        border: 1.5px solid #fecaca;
    }

    .btn-danger:hover {
        background: var(--red-pale);
        border-color: var(--red);
    }

    .action-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .action-row .btn { flex: 1; min-width: 120px; }

    .star-rating {
        display: flex;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
    }

    .star-btn {
        background: none;
        border: none;
        font-size: 2rem;
        cursor: pointer;
        color: #d1d5db;
        transition: transform 0.2s ease, color 0.2s ease;
        padding: 4px;
        line-height: 1;
    }

    .star-btn:hover { transform: scale(1.2); }
    .star-btn.selected { color: #fbbf24; }

    .rating-label {
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        margin-top: 8px;
        min-height: 20px;
    }

    .rating-label.good { color: var(--green); }
    .rating-label.bad { color: var(--red); }
    .rating-label.neutral { color: var(--muted); }

    .stars-display {
        display: flex;
        gap: 2px;
        font-size: 1.5rem;
        flex-wrap: wrap;
    }

    .stars-display .star { color: #fbbf24; }
    .stars-display .star.empty { color: #d1d5db; }

    .feedback-text {
        font-size: 13px;
        color: var(--ink-soft);
        font-style: italic;
        margin-top: 8px;
    }

    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.18s ease, visibility 0s linear 0.18s;
        backdrop-filter: blur(2px);
    }

    .modal-overlay.open {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.18s ease;
    }

    .modal-box {
        background: var(--paper);
        border-radius: var(--radius);
        box-shadow: 0 24px 64px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 440px;
        max-height: 90vh;
        overflow-y: auto;
        transform: translateY(12px) scale(0.98);
        transition: transform 0.18s ease;
    }

    .modal-overlay.open .modal-box {
        transform: translateY(0) scale(1);
    }

    .modal-head {
        padding: 18px 20px;
        border-bottom: 1px solid var(--line-light);
    }

    .modal-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
    }

    .modal-body {
        padding: 20px;
    }

    .modal-body p {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 16px;
    }

    .modal-body textarea,
    .modal-body select,
    .modal-body input {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid var(--line);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: var(--transition);
    }

    .modal-body textarea:focus,
    .modal-body select:focus,
    .modal-body input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(5,150,105,0.08);
    }

    .modal-footer {
        display: flex;
        gap: 10px;
        padding: 0 20px 20px;
        flex-wrap: wrap;
    }

    .modal-footer .btn { flex: 1; min-width: 100px; }

    .text-muted { color: var(--muted); font-size: 13px; }

    .spinner-sm {
        width: 30px;
        height: 30px;
        border: 3px solid var(--line);
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .order-updated {
        animation: flash 1s ease;
    }

    @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }

    @media (max-width: 480px) {
        .page-title { font-size: 1.25rem; }
        .file-item { flex-direction: column; align-items: stretch; }
        .file-info { min-width: auto; }
        .file-download { align-self: flex-end; }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Order #<span id="order-number">---</span></h1>
        <span id="order-status-badge"></span>
    </div>
    <a href="/client/orders/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Orders
    </a>
</div>

<div id="order-content">
    <div style="text-align:center;padding:48px 0;">
        <div class="spinner-sm" style="margin:0 auto;"></div>
        <p class="text-muted" style="margin-top:12px;">Loading order details...</p>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
var orderId = window.location.pathname.split('/').filter(Boolean).pop();
var orderData = null;
var refreshTimer = null;

function getToken() { return localStorage.getItem('access_token'); }
function getHeaders() {
    return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' };
}

function formatCurrency(amount) { return '$' + parseFloat(amount || 0).toFixed(2); }
function formatDate(dateString) {
    if (!dateString) return 'N/A';
    return new Date(dateString).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function getStatusLabel(status) {
    var map = { request: 'Request', in_progress: 'In Progress', awaiting_approval: 'Awaiting Approval', completed: 'Completed', cancelled: 'Cancelled', declined: 'Declined', refund_pending: 'Refund Pending' };
    return map[status] || status;
}

function getStatusClass(status) {
    return getStatusLabel(status).toLowerCase().replace(/ /g, '_');
}

function getProgress(status) {
    var map = { request: 10, in_progress: 50, awaiting_approval: 90, completed: 100 };
    return map[status] || 0;
}

function showModal(html) {
    var overlay = document.getElementById('modalOverlay');
    var box = document.getElementById('modalBox');
    box.innerHTML = html;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    var overlay = document.getElementById('modalOverlay');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

function apiToast(message, type) {
    if (window.Toast) {
        window.Toast.show(message, type);
    } else {
        alert(message);
    }
}

async function loadOrder(keepScroll) {
    try {
        var token = getToken();
        if (!token) {
            document.getElementById('order-content').innerHTML = '<div style="text-align:center;padding:48px;"><p style="color:var(--red);">Please login to view order details</p></div>';
            return;
        }

        var response = await fetch('/api/v1/client/orders/' + orderId + '/', { headers: getHeaders() });
        if (!response.ok) throw new Error(response.status === 404 ? 'Order not found' : 'Failed to load order');

        var data = await response.json();
        orderData = data;
        renderOrder(orderData, keepScroll);
    } catch (e) {
        document.getElementById('order-content').innerHTML = '<div style="text-align:center;padding:48px;"><p style="color:var(--red);">' + e.message + '</p><a href="/client/orders/" style="color:var(--green);font-weight:600;">Back to Orders</a></div>';
    }
}

function renderOrder(order, keepScroll) {
    var container = document.getElementById('order-content');
    var previousHtml = container.innerHTML;

    document.getElementById('order-number').textContent = order.order_number || 'N/A';
    document.getElementById('order-status-badge').innerHTML = '<span class="badge ' + getStatusClass(order.status) + '">' + getStatusLabel(order.status) + '</span>';

    var canApprove = order.status === 'awaiting_approval';
    var canRate = order.status === 'completed' && !order.rating;
    var hasRated = order.status === 'completed' && order.rating;
    var canCancel = order.status !== 'completed' && order.status !== 'cancelled' && order.status !== 'declined';

    var html = '<div class="detail-grid"><div class="main-col">';

    html += '<div class="card"><div class="card-header"><h2 class="card-title">Order Details</h2></div><div class="card-body">';
    html += '<div class="detail-row">';
    html += '<div class="detail-item"><span class="detail-label">Academic Level</span><span class="detail-value">' + (order.academic_level || '-') + '</span></div>';
    html += '<div class="detail-item"><span class="detail-label">Paper Type</span><span class="detail-value">' + (order.paper_type || '-') + '</span></div>';
    html += '<div class="detail-item"><span class="detail-label">Subject</span><span class="detail-value">' + (order.subject || '-') + '</span></div>';
    html += '<div class="detail-item"><span class="detail-label">Pages / Words</span><span class="detail-value">' + (order.pages || 'N/A') + ' / ' + (order.words || 'N/A') + '</span></div>';
    html += '<div class="detail-item"><span class="detail-label">Deadline</span><span class="detail-value">' + formatDate(order.deadline) + '</span></div>';
    html += '<div class="detail-item"><span class="detail-label">Format</span><span class="detail-value">' + (order.format || '-') + '</span></div>';
    html += '<div class="detail-item"><span class="detail-label">Sources</span><span class="detail-value">' + (order.sources_count || 0) + '</span></div>';
    html += '<div class="detail-item"><span class="detail-label">Created</span><span class="detail-value">' + formatDate(order.created_at) + '</span></div>';
    html += '</div>';
    html += '<div class="divider"></div>';
    html += '<div class="detail-item"><span class="detail-label">Topic</span><div class="topic-block">' + (order.topic || '-') + '</div></div>';
    html += '<div class="divider"></div>';
    html += '<div class="detail-item"><span class="detail-label">Instructions</span><div class="instructions-block">' + (order.instructions || 'No instructions provided.') + '</div></div>';

    if (order.attachments && order.attachments.length > 0) {
        html += '<div class="divider"></div><span class="detail-label" style="margin-bottom:8px;display:block;">Attachments</span>';
        order.attachments.forEach(function(att) {
            html += '<div class="file-item"><div class="file-info"><span class="file-icon"><i class="fas fa-paperclip"></i></span><div><div class="file-name">' + att.filename + '</div><div class="file-size">' + (att.file_size / 1024).toFixed(1) + ' KB</div></div></div><a href="' + att.file + '" target="_blank" class="file-download">Download</a></div>';
        });
    }

    if (order.delivered_file) {
        html += '<div class="divider"></div><span class="detail-label" style="color:var(--green);margin-bottom:8px;display:block;">Delivered File</span>';
        html += '<div class="file-item delivered"><div class="file-info"><span class="file-icon"><i class="fas fa-check-circle"></i></span><div><div class="file-name">' + (order.delivered_file.filename || 'paper.pdf') + '</div></div></div><a href="' + order.delivered_file.file + '" target="_blank" class="file-download">Download</a></div>';
    }

    html += '</div></div>';

    if (canApprove) {
        html += '<div class="card"><div class="card-header"><h2 class="card-title">Delivery Actions</h2></div><div class="card-body">';
        html += '<div class="action-row"><button class="btn btn-primary" onclick="approveOrder()">Approve Paper</button><button class="btn btn-outline" onclick="showRevisionModal()">Request Revision</button></div>';
        if (order.auto_approve_at) html += '<p class="text-muted" style="text-align:center;margin-top:12px;">Auto-approval in ' + formatTimeRemaining(order.auto_approve_at) + '</p>';
        html += '</div></div>';
    }

    if (canRate) {
        html += '<div class="card"><div class="card-header"><h2 class="card-title">Rate This Order</h2></div><div class="card-body">';
        html += '<div class="star-rating" id="starRating">';
        for (var i = 1; i <= 5; i++) html += '<button class="star-btn" data-rating="' + i + '">★</button>';
        html += '</div><div class="rating-label" id="ratingLabel"></div>';
        html += '<textarea id="ratingFeedback" style="width:100%;margin-top:12px;" rows="3" placeholder="Share your experience (optional)..."></textarea>';
        html += '<button class="btn btn-primary" id="submitRatingBtn" disabled style="margin-top:12px;" onclick="submitRating()">Submit Rating</button>';
        html += '</div></div>';
    }

    if (hasRated) {
        html += '<div class="card"><div class="card-header"><h2 class="card-title">Your Rating</h2></div><div class="card-body">';
        html += '<div class="stars-display">';
        for (var j = 1; j <= 5; j++) html += '<span class="star' + (j <= order.rating ? '' : ' empty') + '">★</span>';
        html += '<span style="margin-left:12px;font-weight:600;">' + order.rating + '/5</span></div>';
        if (order.feedback) html += '<div class="feedback-text">"' + order.feedback + '"</div>';
        html += '</div></div>';
    }

    html += '</div><div class="side-col">';

    html += '<div class="card"><div class="card-header"><h2 class="card-title">Order Summary</h2></div><div class="card-body">';
    html += '<div class="price-row"><span>Base Price</span><span>' + formatCurrency(order.base_price) + '</span></div>';
    html += '<div class="price-row"><span>Level Multiplier</span><span>' + (order.level_multiplier || '1.00') + 'x</span></div>';
    html += '<div class="price-row"><span>Urgency Multiplier</span><span>' + (order.urgency_multiplier || '1.00') + 'x</span></div>';
    html += '<div class="price-row total"><span>Total</span><span class="price-amount">' + formatCurrency(order.total_price) + '</span></div>';
    html += '</div></div>';

    html += '<div class="card"><div class="card-header"><h2 class="card-title">Progress</h2></div><div class="card-body">';
    html += '<div class="progress-section"><div class="progress-bar"><div class="progress-fill" style="width:' + getProgress(order.status) + '%"></div></div>';
    html += '<div class="progress-steps"><span>Request</span><span>In Progress</span><span>Delivered</span><span>Completed</span></div></div>';
    html += '</div></div>';

    html += '<div class="card"><div class="card-header"><h2 class="card-title">Actions</h2></div><div class="card-body">';
    html += '<a href="/client/messages/' + order.id + '/" class="btn btn-primary"><i class="fas fa-comment"></i> Send Message</a>';
    if (canCancel) html += '<button class="btn btn-danger" onclick="showCancelModal()"><i class="fas fa-times"></i> Cancel Order</button>';
    if (order.status === 'completed') html += '<button class="btn btn-outline" onclick="window.location.href=\'/client/refund/request/' + order.id + '/\'">Request Refund</button>';
    html += '</div></div>';

    html += '<div class="card"><div class="card-body">';
    html += '<p class="text-muted">Need help with your order?</p>';
    html += '<a href="/contact/" style="color:var(--green);font-weight:600;display:block;margin-bottom:6px;">Contact Support</a>';
    html += '<a href="/faq/" style="color:var(--green);font-weight:600;">View FAQ</a>';
    html += '</div></div>';

    html += '</div></div>';

    container.innerHTML = html;

    if (canRate) setupStarRating();

    if (keepScroll) {
        // Preserve scroll position (default)
    } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Highlight updated content
    if (!keepScroll && previousHtml && container.innerHTML !== previousHtml) {
        container.classList.add('order-updated');
        setTimeout(function() { container.classList.remove('order-updated'); }, 1000);
    }
}

function setupStarRating() {
    var stars = document.querySelectorAll('#starRating .star-btn');
    var label = document.getElementById('ratingLabel');
    var submitBtn = document.getElementById('submitRatingBtn');
    var selectedRating = 0;

    stars.forEach(function(star) {
        star.addEventListener('click', function() {
            selectedRating = parseInt(this.dataset.rating);
            stars.forEach(function(s, i) { s.classList.toggle('selected', i < selectedRating); });
            var labels = { 1: { text: 'Terrible', cls: 'bad' }, 2: { text: 'Poor', cls: 'bad' }, 3: { text: 'Okay', cls: 'neutral' }, 4: { text: 'Good', cls: 'good' }, 5: { text: 'Excellent', cls: 'good' } };
            var l = labels[selectedRating];
            label.textContent = l.text; label.className = 'rating-label ' + l.cls;
            submitBtn.disabled = false;
        });
    });
}

function formatTimeRemaining(timestamp) {
    var diff = new Date(timestamp) - new Date();
    if (diff <= 0) return 'pending';
    var hours = Math.floor(diff / 3600000);
    var minutes = Math.floor((diff % 3600000) / 60000);
    return hours + 'h ' + minutes + 'm';
}

async function approveOrder() {
    try {
        var r = await fetch('/api/v1/client/orders/' + orderId + '/approve/', { method: 'POST', headers: getHeaders() });
        var d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Failed');
        apiToast('Order approved successfully!', 'success');
        setTimeout(function() { loadOrder(true); }, 1500);
    } catch (e) { apiToast(e.message, 'error'); }
}

function showRevisionModal() {
    showModal(
        '<div class="modal-head"><h3 class="modal-title">Request Revision</h3></div>' +
        '<div class="modal-body"><p>Please specify what changes you need:</p><textarea id="revisionNotes" rows="4" placeholder="Describe the revisions needed..."></textarea></div>' +
        '<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="confirmRevision">Submit Request</button></div>'
    );
    document.getElementById('confirmRevision').addEventListener('click', async function() {
        var notes = document.getElementById('revisionNotes').value.trim();
        if (!notes) { apiToast('Please specify the revisions needed', 'error'); return; }
        try {
            var r = await fetch('/api/v1/client/orders/' + orderId + '/revision/', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ notes: notes }) });
            var d = await r.json();
            if (!r.ok) throw new Error(d.error || 'Failed');
            closeModal();
            apiToast('Revision requested successfully', 'success');
            setTimeout(function() { loadOrder(true); }, 1500);
        } catch (e) { apiToast(e.message, 'error'); }
    });
}

function showCancelModal() {
    showModal(
        '<div class="modal-head"><h3 class="modal-title">Cancel Order</h3></div>' +
        '<div class="modal-body"><p>Are you sure you want to cancel this order?</p><select id="cancelReason"><option value="changed_mind">Changed my mind</option><option value="found_elsewhere">Found another writer</option><option value="deadline_issue">Deadline too tight</option><option value="price_issue">Price too high</option><option value="other">Other</option></select><input type="text" id="cancelOther" placeholder="Please specify" style="display:none;margin-top:8px;"></div>' +
        '<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="confirmCancel">Confirm Cancellation</button></div>'
    );
    document.getElementById('cancelReason').addEventListener('change', function() {
        document.getElementById('cancelOther').style.display = this.value === 'other' ? 'block' : 'none';
    });
    document.getElementById('confirmCancel').addEventListener('click', async function() {
        var reason = document.getElementById('cancelReason').value;
        var other = document.getElementById('cancelOther').value;
        var finalReason = reason === 'other' ? other : reason;
        try {
            var r = await fetch('/api/v1/client/orders/' + orderId + '/cancel/', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ reason: finalReason }) });
            var d = await r.json();
            if (!r.ok) throw new Error(d.error || 'Failed');
            closeModal();
            apiToast('Order cancelled successfully', 'success');
            setTimeout(function() { window.location.href = '/client/orders/'; }, 1500);
        } catch (e) { apiToast(e.message, 'error'); }
    });
}

async function submitRating() {
    var rating = document.querySelectorAll('#starRating .star-btn.selected').length;
    if (rating === 0) { apiToast('Please select a rating', 'error'); return; }
    var feedback = document.getElementById('ratingFeedback').value.trim();
    try {
        var r = await fetch('/api/v1/client/orders/' + orderId + '/rate/', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ rating: rating, feedback: feedback }) });
        var d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Failed');
        apiToast('Thank you for your feedback!', 'success');
        setTimeout(function() { loadOrder(true); }, 1500);
    } catch (e) { apiToast(e.message, 'error'); }
}

function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function() {
        if (!document.hidden) {
            loadOrder(true);
        }
    }, 15000);
}

document.addEventListener('DOMContentLoaded', function() {
    loadOrder();
    startAutoRefresh();

    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            loadOrder(true);
        }
    });
});
</script>
{% endblock %}
