{% extends "client_base.html" %}

{% block title %}Notifications - Client{% endblock %}

{% block extra_css %}
<style>
    .notif-page {
        width: 100%;
        min-width: 0;
    }

    .notif-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
    }

    .notif-header h1 {
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        font-weight: 800;
        color: var(--ink);
        margin: 0;
        line-height: 1.2;
    }

    .notif-header p {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0.2rem 0 0;
    }

    .notif-card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
    }

    .notif-toolbar {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        background: var(--surface);
    }

    .notif-toolbar .unread-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--ink-soft);
    }

    .notif-toolbar .unread-label span {
        color: var(--green);
    }

    .filter-group {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 0.25rem 0.75rem;
        font-size: 0.7rem;
        font-weight: 600;
        border-radius: var(--radius-full);
        border: 1.5px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .filter-btn:hover {
        border-color: var(--green);
        color: var(--green-dark);
    }

    .filter-btn.active {
        background: var(--green);
        color: white;
        border-color: var(--green);
    }

    .notif-list {
        max-height: calc(100vh - 340px);
        min-height: 360px;
        overflow-y: auto;
    }

    .notif-item {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line-light);
        transition: background 0.15s ease;
        border-left: 3px solid transparent;
        position: relative;
    }

    .notif-item:last-child {
        border-bottom: none;
    }

    .notif-item:hover {
        background: var(--surface);
    }

    .notif-item.unread {
        background: #eff6ff;
        border-left-color: #3b82f6;
    }

    .notif-item.unread:hover {
        background: #dbeafe;
    }

    .notif-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
    }

    .notif-icon.order { background: #dbeafe; color: #2563eb; }
    .notif-icon.message { background: #dcfce7; color: #16a34a; }
    .notif-icon.system { background: #fef3c7; color: #d97706; }
    .notif-icon.warning { background: #fee2e2; color: #dc2626; }
    .notif-icon.info { background: #f3e8ff; color: #7c3aed; }

    .notif-content {
        min-width: 0;
        flex: 1;
    }

    .notif-content .title {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--ink);
        margin: 0;
    }

    .notif-content .message {
        font-size: 0.8rem;
        color: var(--ink-soft);
        margin: 0.2rem 0 0;
        word-break: break-word;
    }

    .notif-content .link {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--green);
        text-decoration: none;
        display: inline-block;
        margin-top: 0.3rem;
        transition: color 0.2s;
    }

    .notif-content .link:hover {
        color: var(--green-dark);
    }

    .notif-time {
        font-size: 0.65rem;
        color: var(--muted);
        white-space: nowrap;
        flex-shrink: 0;
        margin-top: 0.1rem;
    }

    .notif-actions {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity 0.15s ease;
    }

    .notif-item:hover .notif-actions {
        opacity: 1;
    }

    .notif-actions button {
        background: none;
        border: none;
        padding: 0.2rem 0.4rem;
        font-size: 0.75rem;
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: all 0.2s;
        color: var(--muted);
    }

    .notif-actions .mark-read-btn {
        color: var(--green);
    }
    .notif-actions .mark-read-btn:hover {
        background: var(--green-pale);
        color: var(--green-dark);
    }
    .notif-actions .delete-btn {
        color: var(--red);
    }
    .notif-actions .delete-btn:hover {
        background: var(--red-pale);
        color: #b91c1c;
    }

    .notif-footer {
        padding: 0.75rem 1.25rem;
        border-top: 1px solid var(--line-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        background: var(--surface);
    }

    .notif-footer .info {
        font-size: 0.75rem;
        color: var(--muted);
    }

    .notif-footer .pagination {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .notif-footer .pagination button {
        padding: 0.2rem 0.75rem;
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--ink-soft);
        cursor: pointer;
        transition: all 0.2s;
    }

    .notif-footer .pagination button:hover:not(:disabled) {
        background: var(--green-pale);
        border-color: var(--green);
        color: var(--green-dark);
    }

    .notif-footer .pagination button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .notif-footer .pagination .page-text {
        font-size: 0.75rem;
        color: var(--muted);
    }

    .notif-footer select {
        padding: 0.2rem 0.4rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--paper);
        font-size: 0.75rem;
        color: var(--ink);
        outline: none;
    }

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        color: var(--muted);
        text-align: center;
    }

    .empty-state i {
        font-size: 2.5rem;
        color: var(--line);
        margin-bottom: 1rem;
    }

    .empty-state p {
        margin: 0;
        font-size: 0.9rem;
    }
    .empty-state .sub {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.25rem;
    }

    @media (max-width: 640px) {
        .notif-header {
            flex-direction: column;
            align-items: flex-start;
        }
        .notif-toolbar {
            flex-direction: column;
            align-items: stretch;
            gap: 0.5rem;
        }
        .filter-group {
            justify-content: flex-start;
        }
        .notif-item {
            padding: 0.75rem 1rem;
            flex-wrap: wrap;
        }
        .notif-actions {
            opacity: 1;
            width: 100%;
            justify-content: flex-end;
            padding-top: 0.3rem;
            border-top: 1px solid var(--line-light);
        }
        .notif-footer {
            flex-direction: column;
            align-items: stretch;
            gap: 0.5rem;
        }
        .notif-footer .pagination {
            justify-content: center;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="notif-page">

    <div class="notif-header">
        <div>
            <h1>Notifications</h1>
            <p>Stay updated with your orders and messages</p>
        </div>
        <button id="markAllReadBtn" class="aw-btn-secondary" style="font-size:0.8rem;padding:0.4rem 1rem;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink-soft);cursor:pointer;transition:all 0.2s;">
            <i class="fas fa-check-double mr-1"></i>Mark all read
        </button>
    </div>

    <div class="notif-card">

        <div class="notif-toolbar">
            <span class="unread-label"><span id="unreadCount">0</span> unread</span>
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="unread">Unread</button>
                <button class="filter-btn" data-filter="read">Read</button>
            </div>
        </div>

        <div class="notif-list" id="notificationsList">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading notifications...</p>
            </div>
        </div>

        <div class="notif-footer">
            <div class="info">
                <span id="paginationInfo">Showing 0-0 of 0</span>
                <select id="pageSizeSelect" style="margin-left:0.5rem;">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div class="pagination">
                <button id="prevPage" disabled>Previous</button>
                <span class="page-text" id="pageInfo">Page 1 of 1</span>
                <button id="nextPage" disabled>Next</button>
            </div>
        </div>

    </div>

</div>

<script>
let currentPage = 1;
let pageSize = 20;
let totalPages = 1;
let filter = 'all';

function getCsrfToken() {
    const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
    return cookie ? cookie.split('=')[1] : '';
}

function getApiHeaders() {
    const token = localStorage.getItem('access_token');
    return {
        'Content-Type': 'application/json',
        'Authorization': token ? 'Bearer ' + token : '',
        'X-CSRFToken': getCsrfToken()
    };
}

async function fetchNotifications() {
    try {
        const params = new URLSearchParams();
        params.append('page', currentPage);
        params.append('page_size', pageSize);
        if (filter === 'unread') params.append('filter', 'unread');
        if (filter === 'read') params.append('filter', 'read');

        const response = await fetch('/api/v1/client/notifications/?' + params.toString(), {
            headers: getApiHeaders()
        });
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();
        renderNotifications(data.results || []);
        updatePagination(data.count || 0, data.page || 1);
        updateUnreadCount(data.results || []);
    } catch (error) {
        console.error('Notifications error:', error);
        document.getElementById('notificationsList').innerHTML = `
            <div class="empty-state" style="color:var(--red);">
                <i class="fas fa-exclamation-circle"></i>
                <p>Failed to load notifications</p>
                <button onclick="fetchNotifications()" style="margin-top:0.5rem;color:var(--green);background:none;border:none;cursor:pointer;font-weight:600;">Retry</button>
            </div>
        `;
    }
}

function renderNotifications(list) {
    const container = document.getElementById('notificationsList');
    if (!list || list.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-bell-slash"></i>
                <p>No notifications</p>
                <span class="sub">You're all caught up!</span>
            </div>
        `;
        return;
    }

    container.innerHTML = list.map(notif => {
        const isUnread = !notif.is_read;
        const iconMap = { 'order': 'fa-file-alt', 'message': 'fa-envelope', 'system': 'fa-cog', 'warning': 'fa-exclamation-triangle', 'info': 'fa-info-circle' };
        const typeClass = notif.type || 'info';
        const icon = iconMap[typeClass] || 'fa-bell';
        return `
            <div class="notif-item ${isUnread ? 'unread' : ''}" data-id="${notif.id}">
                <div class="notif-icon ${typeClass}">
                    <i class="fas ${icon}"></i>
                </div>
                <div class="notif-content">
                    <p class="title">${escapeHtml(notif.title)}</p>
                    <p class="message">${escapeHtml(notif.message)}</p>
                    ${notif.link ? `<a href="${notif.link}" class="link">View details →</a>` : ''}
                </div>
                <span class="notif-time">${formatRelativeTime(notif.created_at)}</span>
                <div class="notif-actions">
                    ${isUnread ? `<button class="mark-read-btn" onclick="markRead('${notif.id}')"><i class="fas fa-check"></i></button>` : ''}
                    <button class="delete-btn" onclick="deleteNotif('${notif.id}')"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        `;
    }).join('');
}

function updateUnreadCount(list) {
    const unread = list.filter(n => !n.is_read).length;
    document.getElementById('unreadCount').textContent = unread;
}

function updatePagination(total, page) {
    const totalPages = Math.ceil(total / pageSize) || 1;
    const start = (page - 1) * pageSize + 1;
    const end = Math.min(page * pageSize, total);
    document.getElementById('paginationInfo').textContent = `Showing ${total > 0 ? start : 0}-${end} of ${total}`;
    document.getElementById('pageInfo').textContent = `Page ${page} of ${totalPages}`;
    document.getElementById('prevPage').disabled = page <= 1;
    document.getElementById('nextPage').disabled = page >= totalPages;
}

async function markRead(id) {
    try {
        const response = await fetch(`/api/v1/client/notifications/${id}/read/`, {
            method: 'POST',
            headers: getApiHeaders()
        });
        if (response.ok) {
            fetchNotifications();
        }
    } catch (e) {}
}

async function deleteNotif(id) {
    if (!confirm('Delete this notification?')) return;
    try {
        const response = await fetch(`/api/v1/client/notifications/${id}/delete/`, {
            method: 'DELETE',
            headers: getApiHeaders()
        });
        if (response.ok) {
            fetchNotifications();
        }
    } catch (e) {}
}

async function markAllRead() {
    try {
        const response = await fetch('/api/v1/client/notifications/mark-all-read/', {
            method: 'POST',
            headers: getApiHeaders()
        });
        if (response.ok) {
            fetchNotifications();
        }
    } catch (e) {}
}

function formatRelativeTime(timestamp) {
    if (!timestamp) return '';
    const diff = Date.now() - new Date(timestamp).getTime();
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    if (minutes < 1) return 'Just now';
    if (minutes < 60) return minutes + 'm ago';
    if (hours < 24) return hours + 'h ago';
    if (days < 7) return days + 'd ago';
    return new Date(timestamp).toLocaleDateString();
}

function escapeHtml(unsafe) {
    if (!unsafe) return '';
    return String(unsafe)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

document.addEventListener('DOMContentLoaded', function() {
    fetchNotifications();

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            filter = this.dataset.filter;
            currentPage = 1;
            fetchNotifications();
        });
    });

    document.getElementById('prevPage').addEventListener('click', function() {
        if (currentPage > 1) { currentPage--; fetchNotifications(); }
    });
    document.getElementById('nextPage').addEventListener('click', function() {
        if (currentPage < totalPages) { currentPage++; fetchNotifications(); }
    });
    document.getElementById('pageSizeSelect').addEventListener('change', function() {
        pageSize = parseInt(this.value);
        currentPage = 1;
        fetchNotifications();
    });
    document.getElementById('markAllReadBtn').addEventListener('click', markAllRead);
});
</script>
{% endblock %}
